<?xml version="1.0" encoding="UTF-8"?>
<!-- Макет настроек: тот же экран 240x320. -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 240 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="240" height="320" fill="#FFFFFF"/>
  <rect x="0" y="0" width="240" height="20" fill="#101A33"/>
  <text x="6" y="14" font-size="11" fill="#FFFFFF">Настройки</text>

  <rect x="4" y="30" width="232" height="30" rx="3" fill="#EFE9FB" stroke="#7B5CD6"/>
  <text x="12" y="44" font-size="11" fill="#101A33">Сервер:</text>
  <text x="12" y="56" font-size="11" fill="#333">192.168.1.50:8096</text>

  <text x="12" y="80" font-size="11" fill="#101A33">Порт потока: 554</text>
  <line x1="4" y1="90" x2="236" y2="90" stroke="#E6E6EE"/>
  <text x="12" y="110" font-size="11" fill="#101A33">Войти заново</text>
  <line x1="4" y1="120" x2="236" y2="120" stroke="#E6E6EE"/>
  <text x="12" y="140" font-size="11" fill="#101A33">Плеер спрашивает про</text>
  <text x="12" y="154" font-size="11" fill="#101A33">подключение?</text>
  <line x1="4" y1="164" x2="236" y2="164" stroke="#E6E6EE"/>

  <text x="12" y="192" font-size="9" fill="#777">Дома хватает адреса сервера.</text>
  <text x="12" y="206" font-size="9" fill="#777">Из чужой сети здесь же меняется</text>
  <text x="12" y="220" font-size="9" fill="#777">порт потока на тот, что проброшен</text>
  <text x="12" y="234" font-size="9" fill="#777">на роутере.</text>

  <rect x="0" y="300" width="240" height="20" fill="#F0F0F5"/>
  <text x="6" y="314" font-size="10" fill="#333">Выбрать</text>
  <text x="234" y="314" font-size="10" fill="#333" text-anchor="end">Назад</text>
</svg>
