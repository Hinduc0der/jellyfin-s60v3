<?xml version="1.0" encoding="UTF-8"?>
<!-- Вход по коду: на телефоне ничего не набирается, кроме адреса сервера. -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 240 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="240" height="320" fill="#FFFFFF"/>
  <rect x="0" y="0" width="240" height="20" fill="#101A33"/>
  <text x="6" y="14" font-size="11" fill="#FFFFFF">Jellyfin</text>

  <text x="6" y="36" font-size="10" fill="#555">жду подтверждения кода</text>

  <rect x="4" y="46" width="232" height="34" rx="3" fill="#EFE9FB" stroke="#7B5CD6"/>
  <text x="120" y="70" font-size="20" font-weight="bold" fill="#101A33" text-anchor="middle">КОД: 418273</text>

  <text x="12" y="104" font-size="11" fill="#101A33">На компьютере откройте Jellyfin,</text>
  <text x="12" y="120" font-size="11" fill="#101A33">нажмите на своё имя -&gt;</text>
  <text x="12" y="136" font-size="11" fill="#101A33">Быстрое подключение</text>
  <text x="12" y="152" font-size="11" fill="#101A33">и введите этот код.</text>

  <text x="12" y="186" font-size="9" fill="#777">Пароль на телефоне не набирается</text>
  <text x="12" y="200" font-size="9" fill="#777">никогда: кнопочная клавиатура и</text>
  <text x="12" y="214" font-size="9" fill="#777">длинный пароль несовместимы.</text>

  <rect x="0" y="300" width="240" height="20" fill="#F0F0F5"/>
  <text x="234" y="314" font-size="10" fill="#333" text-anchor="end">Выход</text>
</svg>
