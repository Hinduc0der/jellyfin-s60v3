<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="420" fill="#F7F7FB"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#101A33">Из чего всё состоит</text>

  <!-- Телефон -->
  <rect x="30" y="80" width="200" height="250" rx="14" fill="#FFFFFF" stroke="#7B5CD6" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#101A33">Телефон</text>
  <rect x="50" y="128" width="160" height="56" rx="8" fill="#EFE9FB"/>
  <text x="130" y="150" text-anchor="middle" font-size="13" fill="#101A33">Приложение</text>
  <text x="130" y="170" text-anchor="middle" font-size="11" fill="#555">список, вход, место</text>
  <rect x="50" y="196" width="160" height="56" rx="8" fill="#E4F4FB"/>
  <text x="130" y="218" text-anchor="middle" font-size="13" fill="#101A33">RealPlayer</text>
  <text x="130" y="238" text-anchor="middle" font-size="11" fill="#555">показывает видео</text>
  <text x="130" y="282" text-anchor="middle" font-size="11" fill="#777">штатный, ставить</text>
  <text x="130" y="298" text-anchor="middle" font-size="11" fill="#777">ничего не надо</text>

  <!-- Интернет -->
  <rect x="300" y="150" width="140" height="110" rx="14" fill="#FFFFFF" stroke="#BBB" stroke-width="2"/>
  <text x="370" y="196" text-anchor="middle" font-size="14" fill="#101A33">Интернет</text>
  <text x="370" y="218" text-anchor="middle" font-size="12" fill="#555">и ваш роутер</text>

  <!-- Сервер -->
  <rect x="510" y="80" width="360" height="250" rx="14" fill="#FFFFFF" stroke="#4FC3E8" stroke-width="2"/>
  <text x="690" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#101A33">Домашний сервер</text>
  <rect x="530" y="128" width="150" height="80" rx="8" fill="#E4F4FB"/>
  <text x="605" y="154" text-anchor="middle" font-size="13" fill="#101A33">Jellyfin</text>
  <text x="605" y="174" text-anchor="middle" font-size="11" fill="#555">библиотека</text>
  <text x="605" y="190" text-anchor="middle" font-size="11" fill="#555">как и был</text>
  <rect x="700" y="128" width="150" height="80" rx="8" fill="#EFE9FB"/>
  <text x="775" y="154" text-anchor="middle" font-size="13" fill="#101A33">Компаньон</text>
  <text x="775" y="174" text-anchor="middle" font-size="11" fill="#555">перекодирует</text>
  <text x="775" y="190" text-anchor="middle" font-size="11" fill="#555">и раздаёт поток</text>
  <text x="690" y="238" text-anchor="middle" font-size="12" fill="#555">между собой говорят внутри машины</text>
  <text x="690" y="258" text-anchor="middle" font-size="12" fill="#555">компаньон берёт видео у Jellyfin,</text>
  <text x="690" y="276" text-anchor="middle" font-size="12" fill="#555">файлы с диска он не трогает</text>

  <!-- Стрелки -->
  <path d="M 232 170 L 298 170" stroke="#7B5CD6" stroke-width="3" fill="none"/>
  <path d="M 292 164 L 300 170 L 292 176 Z" fill="#7B5CD6"/>
  <text x="265" y="158" text-anchor="middle" font-size="11" fill="#7B5CD6">список</text>

  <path d="M 442 170 L 508 170" stroke="#7B5CD6" stroke-width="3" fill="none"/>
  <path d="M 502 164 L 510 170 L 502 176 Z" fill="#7B5CD6"/>

  <path d="M 508 240 L 442 240" stroke="#4FC3E8" stroke-width="3" fill="none"/>
  <path d="M 448 234 L 440 240 L 448 246 Z" fill="#4FC3E8"/>
  <text x="475" y="230" text-anchor="middle" font-size="11" fill="#2B9BC0">видео</text>

  <path d="M 298 240 L 232 240" stroke="#4FC3E8" stroke-width="3" fill="none"/>
  <path d="M 238 234 L 230 240 L 238 246 Z" fill="#4FC3E8"/>

  <text x="450" y="372" text-anchor="middle" font-size="13" fill="#101A33">Приложение показывает список и отдаёт плееру адрес нужной серии.</text>
  <text x="450" y="394" text-anchor="middle" font-size="13" fill="#101A33">Дальше видео идёт мимо приложения — прямо в плеер.</text>
</svg>
