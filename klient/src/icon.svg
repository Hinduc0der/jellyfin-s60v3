<?xml version="1.0" encoding="UTF-8"?>
<!-- Значок приложения — официальный знак Jellyfin.
     Фигуры взяты один в один из branding/SVG/icon-transparent.svg проекта
     Jellyfin. Знак распространяется по Creative Commons Attribution-ShareAlike
     4.0 (CC BY-SA 4.0), права принадлежат участникам проекта Jellyfin;
     указание авторства — в документации, раздел про значок.
     Файл изменён: переход заменён плоской заливкой (почему — ниже).
     Лицензия этого требует, поэтому сам файл и собранный из него .mif
     остаются под CC BY-SA 4.0, а не под GPL-3.0, как остальной код.

     Заливка плоская, а не переходом, и вот почему. Значки Symbian собираются
     в .mif из SVG Tiny 1.1, а в этом стандарте заливок-переходом нет вовсе.
     Преобразователь (mifconv + SVGTBinEncode) переход принимает и даже
     кодирует — файл выходит на 70 байт больше, — но рисует значок на
     телефоне уже движок S60 3.1, и поддержит ли он его, без установки не
     узнать. Цена ошибки — испорченный значок и потраченная установка,
     поэтому взяты два плоских цвета с той же шкалы: #AA5CC3 -> #00A4DC.
     Внешнее кольцо — её середина, внутренний треугольник чуть лиловее, так
     что направление перехода угадывается даже без него.

     ВНИМАНИЕ: двойной дефис внутри XML-комментария запрещён стандартом, а
     в этом проекте он служит тире. Из-за одного такого тире разбор файла
     молча обрывается: mifconv возвращает ноль и пишет пустой значок в 69
     байт вместо 411. Проверка размера .mif добавлена в build-symbian.bat.
     Здесь тире длинное, и так и надо.

     Размер в меню — около 44 точек, поэтому никаких подробностей: две
     фигуры, обе крупные. Кольцо нарисовано одним путём из двух контуров —
     заполнение по ненулевому правилу оставляет середину пустой. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" baseProfile="tiny"
     width="512" height="512" viewBox="0 0 512 512">
  <path d="M256,201.6c-20.4,0-86.2,119.3-76.2,139.4s142.5,19.9,152.4,0S276.5,201.6,256,201.6z"
        fill="#7B6BCE"/>
  <path d="M256,23.3c-61.6,0-259.8,359.4-229.6,420.1s429.3,60,459.2,0S317.6,23.3,256,23.3z M406.5,390.8c-19.6,39.3-281.1,39.8-300.9,0s110.1-275.3,150.4-275.3S426.1,351.4,406.5,390.8z"
        fill="#5B80D0"/>
</svg>
