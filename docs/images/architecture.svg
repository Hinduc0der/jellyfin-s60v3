<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="420" fill="#F7F7FB"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#101A33">How the pieces fit</text>

  <!-- Phone -->
  <rect x="30" y="80" width="200" height="250" rx="14" fill="#FFFFFF" stroke="#7B5CD6" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#101A33">Phone</text>
  <rect x="50" y="128" width="160" height="56" rx="8" fill="#EFE9FB"/>
  <text x="130" y="150" text-anchor="middle" font-size="13" fill="#101A33">The app</text>
  <text x="130" y="170" text-anchor="middle" font-size="11" fill="#555">library, sign-in, position</text>
  <rect x="50" y="196" width="160" height="56" rx="8" fill="#E4F4FB"/>
  <text x="130" y="218" text-anchor="middle" font-size="13" fill="#101A33">RealPlayer</text>
  <text x="130" y="238" text-anchor="middle" font-size="11" fill="#555">plays the video</text>
  <text x="130" y="282" text-anchor="middle" font-size="11" fill="#777">already on the phone,</text>
  <text x="130" y="298" text-anchor="middle" font-size="11" fill="#777">nothing to install</text>

  <!-- Internet -->
  <rect x="300" y="150" width="140" height="110" rx="14" fill="#FFFFFF" stroke="#BBB" stroke-width="2"/>
  <text x="370" y="196" text-anchor="middle" font-size="14" fill="#101A33">Internet</text>
  <text x="370" y="218" text-anchor="middle" font-size="12" fill="#555">and your router</text>

  <!-- Server -->
  <rect x="510" y="80" width="360" height="250" rx="14" fill="#FFFFFF" stroke="#4FC3E8" stroke-width="2"/>
  <text x="690" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#101A33">Home server</text>
  <rect x="530" y="128" width="150" height="80" rx="8" fill="#E4F4FB"/>
  <text x="605" y="154" text-anchor="middle" font-size="13" fill="#101A33">Jellyfin</text>
  <text x="605" y="174" text-anchor="middle" font-size="11" fill="#555">your library</text>
  <text x="605" y="190" text-anchor="middle" font-size="11" fill="#555">untouched</text>
  <rect x="700" y="128" width="150" height="80" rx="8" fill="#EFE9FB"/>
  <text x="775" y="154" text-anchor="middle" font-size="13" fill="#101A33">Companion</text>
  <text x="775" y="174" text-anchor="middle" font-size="11" fill="#555">transcodes and</text>
  <text x="775" y="190" text-anchor="middle" font-size="11" fill="#555">streams it out</text>
  <text x="690" y="238" text-anchor="middle" font-size="12" fill="#555">they talk inside one machine</text>
  <text x="690" y="258" text-anchor="middle" font-size="12" fill="#555">the companion asks Jellyfin for video,</text>
  <text x="690" y="276" text-anchor="middle" font-size="12" fill="#555">it never touches files on disk</text>

  <!-- Arrows -->
  <path d="M 232 170 L 298 170" stroke="#7B5CD6" stroke-width="3" fill="none"/>
  <path d="M 292 164 L 300 170 L 292 176 Z" fill="#7B5CD6"/>
  <text x="265" y="158" text-anchor="middle" font-size="11" fill="#7B5CD6">library</text>

  <path d="M 442 170 L 508 170" stroke="#7B5CD6" stroke-width="3" fill="none"/>
  <path d="M 502 164 L 510 170 L 502 176 Z" fill="#7B5CD6"/>

  <path d="M 508 240 L 442 240" stroke="#4FC3E8" stroke-width="3" fill="none"/>
  <path d="M 448 234 L 440 240 L 448 246 Z" fill="#4FC3E8"/>
  <text x="475" y="230" text-anchor="middle" font-size="11" fill="#2B9BC0">video</text>

  <path d="M 298 240 L 232 240" stroke="#4FC3E8" stroke-width="3" fill="none"/>
  <path d="M 238 234 L 230 240 L 238 246 Z" fill="#4FC3E8"/>

  <text x="450" y="372" text-anchor="middle" font-size="13" fill="#101A33">The app shows the library and hands the player a URL.</text>
  <text x="450" y="394" text-anchor="middle" font-size="13" fill="#101A33">From there the video bypasses the app and goes straight to the player.</text>
</svg>
